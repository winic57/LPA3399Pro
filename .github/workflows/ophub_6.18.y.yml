name: ophub kernel 6.18.y

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ophub_6.18.y.yml'
      - 'kdevbuild/ophub_6.18.y_kernel.sh'
      - 'kernel-6.18/config-6.18'
      - 'kernel-6.18/*.patch'
  repository_dispatch:
  workflow_dispatch:
    inputs: { }

env:
  TZ: America/New_York

concurrency:
  group: ophub-kernel-6.18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show environment
        run: |
          nproc
          uname -a
          cat /etc/*release
          free -h
          df -h

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ophub-6.18-ccache-${{ hashFiles('kernel-6.18/config-6.18', 'kernel-6.18/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-ophub-6.18-ccache-

      - name: Run build in Ubuntu 22.04 container
        timeout-minutes: 120
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          ls -alh
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.ccache:/workspace/.ccache \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            -e KERNEL_JOBS=8 \
            -e CCACHE_MAXSIZE=5G \
            ubuntu:22.04 \
            bash -c "
              chmod +x /workspace/kdevbuild/ophub_6.18.y_kernel.sh ;
              /workspace/kdevbuild/ophub_6.18.y_kernel.sh
            "

      - name: List build output
        if: always()
        run: |
          ls -alh ${{ github.workspace }}/output/ 2>/dev/null || echo "No output directory"
          md5sum ${{ github.workspace }}/output/* 2>/dev/null || true

      - name: Upload workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ophub-kernel-6.18.33-artifacts
          path: ${{ github.workspace }}/output/*
          if-no-files-found: error

      - name: Upload Image to Release
        if: success()
        uses: ncipollo/release-action@v1
        with:
          tag: Neardi-LPA3399Pro-kernel-6.18
          name: Neardi-LPA3399Pro-kernel-6.18
          artifacts: ${{ github.workspace }}/output/*
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 镜像说明
            LPA3399Pro kernel 6.18.33 build
            - Custom config with RTW88 WiFi + PPP/QMI 4G modem support
            - GMAC v4e DMA SWR workaround patch applied

      - name: Notify WeChat Webhook
        if: always()
        run: |
          curl '${{ secrets.WECHAT_WORK_WEBHOOK }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "GitHub Action Build Notification\nProject: ${{ github.event.repository.name }}\nWorkflow: ${{ github.workflow }}\nStatus: ${{ job.status }}\nCommit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}\nTriggered By: ${{ github.actor }}"
              }
            }'
